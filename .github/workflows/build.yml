name: Build MyQchat FINAL APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List files
        run: |
          ls -la
          cat requirements.txt
          cat main.py | head -20

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 requests

      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyQchat-FINAL-REAL-APK
          path: build/apk
